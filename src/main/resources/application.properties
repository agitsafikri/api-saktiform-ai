spring.application.name=api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dbsaktiform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Postgre1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1700000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

whatsapp.api.username=${WHATSAPP_API_USERNAME:user1}
whatsapp.api.password=${WHATSAPP_API_PASSWORD:pass1}
whatsapp.multidevice.api.url=${WHATSAPP_MULTIDEVICE_API_URL:http://localhost:3000}

minio.url=${MINIO_URL:http://103.49.239.5:9500}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:saktiform-media}
minio.bucket.produk=${MINIO_BUCKET_PRODUK:produk-media}
minio.prefix=${MINIO_PREFIX:media}
minio.public-url=${MINIO_PUBLIC_URL:http://103.49.239.5:9500}

saktiform.api.checkout.url=${SAKTIFORM_CHECKOUT_URL:http://103.49.239.5:3500}

app.superadmin.username=${SUPERADMIN_USERNAME:superadmin}
app.superadmin.password=${SUPERADMIN_PASSWORD:PasswordAdmin1234}

#logging.level.org.hibernate.SQL=ON
#logging.level.org.hibernate.orm.jdbc.bind=ON
#logging.level.org.hibernate.type.descriptor.sql=ON

spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

server.forward-headers-strategy=framework

springdoc.swagger-ui.enabled=true

server.port=8081

# ============================================================
# Multipart upload (sebelumnya tidak diset → default Spring 1MB/10MB).
# Dinaikkan agar muat upload Excel Blast (PRD: 2MB) tanpa membatasi upload media existing.
# Batas spesifik Excel Blast (2MB) ditegakkan di BlastImportService (Fase 2), bukan di sini.
# ============================================================
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:15MB}

# ============================================================
# Blast Chat — worker & batasan (lihat docs/tdd/blast-chat.md §15)
# ============================================================
blast.worker.poll-interval-ms=${BLAST_POLL_INTERVAL_MS:1000}
blast.worker.batch-size=${BLAST_BATCH_SIZE:100}
blast.worker.delay-ms=${BLAST_DELAY_MS:1500}
blast.worker.max-attempts=${BLAST_MAX_ATTEMPTS:3}
blast.worker.lease-duration-ms=${BLAST_LEASE_MS:60000}
blast.worker.reaper-interval-ms=${BLAST_REAPER_MS:30000}
blast.worker.reconcile-interval-ms=${BLAST_RECONCILE_MS:300000}
blast.worker.backoff-base-ms=${BLAST_BACKOFF_BASE_MS:30000}
blast.upload.max-rows=${BLAST_MAX_ROWS:20000}
blast.upload.max-file-size-bytes=${BLAST_MAX_FILE_BYTES:2097152}
blast.reply.window-days=${BLAST_REPLY_WINDOW_DAYS:7}
blast.webhook.secret=${BLAST_WEBHOOK_SECRET:}

